<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperature Scaling</title>
<style>
  :root {
    --bg: #f6f5f2;
    --bg-top: #f8f7f4;
    --bg-bottom: #eeece7;
    --paper: #f6f5f2;
    --ink: #23262b;
    --ink-dim: #6b6f76;
    --card: rgba(255, 255, 255, 0.82);
    --card-border: rgba(35, 38, 43, 0.13);
    --chip: rgba(35, 38, 43, 0.05);
    --accent: #5566a8;
    --accent-ink: #ffffff;
    --spine: #33383f;
    --edge: #a9a49b;
    --halo: #f6f5f2;
    --grid: #23262b;
    --light: 0;
    --t-background: #5c7d9e;
    --t-related: #8d9096;
    --t-problem: #b3766a;
    --t-hypothesis: #8a7a9e;
    --t-method: #58857f;
    --t-experiment: #a8905f;
    --t-result: #648a6b;
    --t-conclusion: #a86d85;
    --t-limitation: #85786a;
    --t-future: #648994;
    --t-unknown: #8d9096;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a;
      --bg-top: #171a21;
      --bg-bottom: #0f1116;
      --paper: #12141a;
      --ink: #e6e8ec;
      --ink-dim: #9aa0aa;
      --card: rgba(20, 23, 29, 0.78);
      --card-border: rgba(255, 255, 255, 0.10);
      --chip: rgba(255, 255, 255, 0.06);
      --accent: #7d8fc4;
      --accent-ink: #10131a;
      --spine: #c8cedb;
      --edge: #4e545f;
      --halo: #12141a;
      --grid: #cfd6e4;
      --light: 1;
      --t-background: #7f9bbb;
      --t-related: #8f949c;
      --t-problem: #c8907c;
      --t-hypothesis: #a494b4;
      --t-method: #74a49c;
      --t-experiment: #bfab84;
      --t-result: #8aad8e;
      --t-conclusion: #c08fa4;
      --t-limitation: #ab9a86;
      --t-future: #85a7b2;
      --t-unknown: #8f949c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a;
    --bg-top: #171a21;
    --bg-bottom: #0f1116;
    --paper: #12141a;
    --ink: #e6e8ec;
    --ink-dim: #9aa0aa;
    --card: rgba(20, 23, 29, 0.78);
    --card-border: rgba(255, 255, 255, 0.10);
    --chip: rgba(255, 255, 255, 0.06);
    --accent: #7d8fc4;
    --accent-ink: #10131a;
    --spine: #c8cedb;
    --edge: #4e545f;
    --halo: #12141a;
    --grid: #cfd6e4;
    --light: 1;
    --t-background: #7f9bbb;
    --t-related: #8f949c;
    --t-problem: #c8907c;
    --t-hypothesis: #a494b4;
    --t-method: #74a49c;
    --t-experiment: #bfab84;
    --t-result: #8aad8e;
    --t-conclusion: #c08fa4;
    --t-limitation: #ab9a86;
    --t-future: #85a7b2;
    --t-unknown: #8f949c;
  }
  :root[data-theme="blueprint"] {
    --bg: #0d1524;
    --bg-top: #14203a;
    --bg-bottom: #0a111e;
    --paper: #0d1524;
    --ink: #dde6f5;
    --ink-dim: #8b9bb5;
    --card: rgba(16, 26, 45, 0.78);
    --card-border: rgba(150, 185, 255, 0.16);
    --chip: rgba(150, 185, 255, 0.08);
    --accent: #6f9ae0;
    --accent-ink: #0a111e;
    --spine: #c6d8f5;
    --edge: #4a5c7a;
    --halo: #0d1524;
    --grid: #9dc0ff;
    --light: 1;
    --t-background: #7f9bbb;
    --t-related: #8f949c;
    --t-problem: #c8907c;
    --t-hypothesis: #a494b4;
    --t-method: #74a49c;
    --t-experiment: #bfab84;
    --t-result: #8aad8e;
    --t-conclusion: #c08fa4;
    --t-limitation: #ab9a86;
    --t-future: #85a7b2;
    --t-unknown: #8f949c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; letter-spacing: 0 !important; }
  [hidden] { display: none !important; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #gl, #lbl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { cursor: grab; touch-action: none; }
  #gl.dragging { cursor: grabbing; }
  #gl.panning { cursor: move; }
  #lbl { pointer-events: none; }
  #fallback { position: fixed; inset: 0; display: none; place-items: center; color: var(--ink-dim); font-size: 14px; }

  .overlay { position: fixed; z-index: 2; }
  .glass {
    background: var(--card); border: 1px solid var(--card-border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #hdr {
    top: 22px; left: 22px; width: min(460px, calc(100vw - 44px)); max-width: calc(100vw - 44px);
    border-radius: 4px; padding: 15px 17px;
  }
  /* the card sits on top of the graph, so it has to be foldable, resizable, and able to
     scroll its own text rather than growing until it covers the argument */
  #hdr-body { overflow-y: auto; overscroll-behavior: contain; max-height: 40vh; }
  #hdr.folded #hdr-body, #hdr.folded #hdr-grip { display: none; }
  #hdr.folded h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hdr-fold {
    position: absolute; top: 9px; right: 8px; z-index: 1; width: 24px; height: 22px;
    display: grid; place-items: center; padding: 0; cursor: pointer;
    background: none; border: none; color: var(--ink-dim); opacity: 0.55;
  }
  #hdr-fold:hover { opacity: 1; }
  #hdr-fold svg { transition: transform 0.18s ease; }
  #hdr.folded #hdr-fold svg { transform: rotate(-90deg); }
  #hdr h1 { padding-right: 26px; }
  #hdr-grip {
    position: absolute; right: 1px; bottom: 1px; width: 15px; height: 15px;
    cursor: nwse-resize; opacity: 0.4; touch-action: none;
    background:
      linear-gradient(135deg, transparent 45%, var(--ink-dim) 45%, var(--ink-dim) 55%, transparent 55%),
      linear-gradient(135deg, transparent 72%, var(--ink-dim) 72%, var(--ink-dim) 82%, transparent 82%);
  }
  #hdr-grip:hover { opacity: 0.85; }
  #hdr h1 { font-size: 15px; line-height: 1.5; font-weight: 600; letter-spacing: 0.01em; }
  #hdr .summary { font-size: 12.5px; color: var(--ink-dim); margin-top: 8px; line-height: 1.65; }
  #hdr .meta { font-size: 10.5px; color: var(--ink-dim); margin-top: 9px; opacity: 0.75; letter-spacing: 0.04em; }
  #hdr .prov {
    font-size: 10px; color: var(--ink-dim); margin-top: 10px; padding-top: 9px;
    border-top: 1px solid var(--card-border); letter-spacing: 0.03em; line-height: 1.55;
  }
  #hdr .prov b { font-weight: 600; color: var(--t-result); }
  #hdr .prov.unverified b { color: var(--t-problem); }

  #toolbar { top: 22px; right: 22px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #toolbar button {
    font: inherit; font-size: 11.5px; padding: 7px 12px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--card-border); background: var(--card); color: var(--ink-dim);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: color .18s, background .18s;
  }
  #toolbar button:hover { color: var(--ink); }
  #toolbar button.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  #toolbar button:disabled { opacity: 0.4; cursor: default; }
  /* the open panel would otherwise sit on top of the toolbar */
  body.panel-open #toolbar { right: calc(min(370px, 100vw) + 22px); }

  #bt-search { width: 32px; padding-left: 0 !important; padding-right: 0 !important; display: grid; place-items: center; }
  #bt-search svg { width: 14px; height: 14px; }

  #search {
    position: fixed; top: 62px; right: 22px; z-index: 4; width: min(330px, calc(100vw - 44px));
    border-radius: 4px; padding: 10px; display: none;
  }
  #search.open { display: block; }
  body.panel-open #search { right: calc(min(370px, 100vw) + 22px); }
  #search-row { display: flex; align-items: center; gap: 7px; }
  #search-row svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--ink-dim); }
  #search-input {
    min-width: 0; flex: 1; font: inherit; font-size: 12px; color: var(--ink);
    background: transparent; border: none; outline: none;
  }
  #search-input::placeholder { color: var(--ink-dim); }
  #search-close {
    width: 24px; height: 24px; display: grid; place-items: center; padding: 0;
    font: inherit; font-size: 17px; line-height: 1; color: var(--ink-dim);
    background: transparent; border: none; cursor: pointer;
  }
  #search-close:hover { color: var(--ink); }
  #search-status { min-height: 15px; margin: 7px 2px 3px; font-size: 10.5px; color: var(--ink-dim); }
  #search-results { max-height: min(48vh, 360px); overflow-y: auto; overscroll-behavior: contain; }
  .search-result {
    width: 100%; display: flex; align-items: baseline; gap: 8px; padding: 7px 8px;
    text-align: left; font: inherit; font-size: 12px; color: var(--ink);
    background: transparent; border: 1px solid transparent; border-radius: 3px; cursor: pointer;
  }
  .search-result:hover, .search-result[aria-selected="true"] { background: var(--chip); border-color: var(--card-border); }
  .search-result .dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; align-self: center; }
  .search-result .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search-result .section { margin-left: auto; flex: 0 0 auto; font-size: 10px; color: var(--ink-dim); }
  #search-empty { padding: 10px 8px; font-size: 12px; color: var(--ink-dim); }

  #settings {
    position: fixed; top: 62px; right: 22px; z-index: 4; border-radius: 4px; padding: 14px 16px;
    min-width: 190px; display: none;
  }
  #settings.open { display: block; }
  #settings .act {
    display: block; width: 100%; margin-top: 4px; padding: 7px 10px; text-align: left;
    font-size: 12px; border-radius: 3px; cursor: pointer; color: var(--ink);
    background: var(--chip); border: 1px solid var(--card-border);
  }
  #settings .act:hover { border-color: var(--ink-dim); }
  #settings .act.warn { border-color: var(--t-problem); color: var(--t-problem); }
  #settings .act .sub { display: block; margin-top: 2px; font-size: 10.5px; color: var(--ink-dim); }
  #settings h4 { font-size: 10px; font-weight: 600; color: var(--ink-dim); letter-spacing: 0.08em;
    text-transform: uppercase; margin: 0 0 7px; }
  #settings h4:not(:first-child) { margin-top: 14px; }
  #settings .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  #settings .seg button {
    font: inherit; font-size: 11px; padding: 5px 9px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--card-border); background: transparent; color: var(--ink-dim);
  }
  #settings .seg button.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  @media (max-width: 820px) { #settings { top: 56px; right: 12px; } }
  @media (max-width: 820px) {
    #search { top: 56px; right: 12px; }
    body.panel-open #search { right: 12px; }
  }
  @media (min-width: 641px) and (max-width: 820px) {
    body.panel-open #search { right: calc(min(370px, 100vw) + 12px); }
  }

  #hud {
    right: 22px; bottom: 22px; padding: 9px 11px; pointer-events: none;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; color: var(--ink-dim);
  }
  #legend { left: 22px; bottom: 22px; display: flex; gap: 5px; flex-wrap: wrap; max-width: min(560px, calc(100vw - 44px)); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 5px 10px;
    border-radius: 3px; cursor: pointer; user-select: none; color: var(--ink-dim);
    background: var(--card); border: 1px solid var(--card-border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity .2s;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip .n { opacity: 0.6; }
  .chip.off { opacity: 0.3; }

  #hint {
    bottom: 22px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-size: 11px; color: var(--ink-dim); border-radius: 3px; padding: 6px 14px; transition: opacity 1.2s;
  }
  #hint.fade { opacity: 0; pointer-events: none; }

  #panel {
    position: fixed; top: 0; right: 0; height: 100%; width: min(370px, 100vw); z-index: 3;
    background: var(--card); border-left: 1px solid var(--card-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transform: translateX(105%); transition: transform 0.32s cubic-bezier(.2,.8,.2,1);
    padding: 22px; overflow-y: auto;
  }
  #panel.open { transform: translateX(0); }
  #panel .close { position: absolute; top: 14px; right: 16px; font-size: 18px; background: none; border: none; color: var(--ink-dim); cursor: pointer; padding: 4px 8px; }
  #panel .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-dim); margin-bottom: 12px; letter-spacing: 0.06em; }
  #panel .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  #panel h2 { font-size: 18px; line-height: 1.4; margin-bottom: 8px; }
  #panel .sec { display: inline-block; font-size: 11px; color: var(--ink-dim); background: var(--chip); border-radius: 6px; padding: 3px 8px; margin-bottom: 14px; }
  #panel .detail { font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
  /* the paper's own sentence, located on its own page — the strongest thing the panel can say,
     so it is set apart rather than folded into the prose */
  #panel .quote {
    margin: 14px 0 0; padding: 10px 0 10px 13px; border-left: 2px solid var(--t-result);
    font-size: 12.5px; line-height: 1.75; color: var(--ink); font-style: italic;
  }
  #panel .quote cite {
    display: block; margin-top: 7px; font-style: normal; font-size: 10.5px;
    color: var(--ink-dim); letter-spacing: 0.04em;
  }
  #panel h3 { font-size: 11.5px; color: var(--ink-dim); margin: 20px 0 8px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  #panel .link { display: flex; align-items: baseline; gap: 8px; font: inherit; font-size: 12.5px; line-height: 1.5; padding: 8px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; width: 100%; border: 0; background: none; color: var(--ink); text-align: left; }
  #panel .link:hover { background: var(--chip); }
  #panel .link .rel { color: var(--ink-dim); font-size: 11px; flex-shrink: 0; }
  #panel .link .ldot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; align-self: center; }
  #panel figure { margin: 16px 0 4px; cursor: zoom-in; }
  #panel figure img {
    width: 100%; display: block; border: 1px solid var(--card-border); border-radius: 3px;
    background: #fff;   /* the plots are drawn for paper; a white mat keeps them legible in dark mode */
  }
  #panel figure figcaption { font-size: 10.5px; color: var(--ink-dim); margin-top: 6px; letter-spacing: 0.03em; }

  #lightbox {
    position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
    background: rgba(0, 0, 0, 0.72); cursor: zoom-out; padding: 24px;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  #lightbox[hidden], #hdr-prov[hidden] { display: none; }
  #lightbox img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 3px; }
  #lightbox .cap {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 11.5px; color: #fff; opacity: 0.8; letter-spacing: 0.04em;
  }

  /* below this the header and the toolbar would collide on one row */
  @media (max-width: 820px) {
    #toolbar, body.panel-open #toolbar {
      top: 12px; left: 12px; right: 12px;
      justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto;
    }
    #toolbar button { flex-shrink: 0; }
    #hdr { top: 62px; left: 12px; width: calc(100vw - 24px); max-width: calc(100vw - 24px); }
  }
  @media (max-width: 640px) {
    #hdr h1 { font-size: 13.5px; }
    #hdr .summary { display: none; }
    #panel { top: auto; bottom: 0; height: min(58vh, 100%); width: 100vw; border-left: none; border-top: 1px solid var(--card-border); transform: translateY(105%); }
    #panel.open { transform: translateY(0); }
    #hint { display: none; }
    body.panel-open #legend { display: none; }
    #search { left: 12px; right: 12px; width: auto; }
  }
  #view-modes { display: flex; flex: 0 0 auto; gap: 0; }
  #view-modes button { border-radius: 0; }
  #view-modes button:first-child { border-radius: 3px 0 0 3px; }
  #view-modes button:last-child { border-radius: 0 3px 3px 0; }
  #reader { position: fixed; inset: 74px 0 0; overflow-y: auto; padding: 12px 24px 80px; background: var(--bg); }
  #reader-inner { max-width: 960px; margin: auto; }
  #reader-head { border-bottom: 1px solid var(--card-border); padding-bottom: 20px; }
  #reader-title { font-size: 22px; line-height: 1.4; margin-bottom: 12px; }
  #reader-summary { font-size: 14px; line-height: 1.7; }
  #reader-provenance { margin-top: 12px; font-size: 12px; color: var(--ink-dim); line-height: 1.6; }
  .read-node { padding: 24px 0; border-bottom: 1px solid var(--card-border); scroll-margin-top: 16px; overflow-wrap: anywhere; }
  .read-node[data-selected="true"] { border-left: 3px solid var(--accent); padding-left: 16px; }
  .read-node h2 { font-size: 17px; line-height: 1.5; margin: 8px 0; }
  .read-node h3 { font-size: 12px; color: var(--ink-dim); margin-top: 16px; }
  .read-node .detail { font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .read-node .badge { font-size: 12px; color: var(--ink-dim); }
  .read-node .sec { font-size: 12px; color: var(--ink-dim); margin-bottom: 8px; }
  .read-node .quote { margin: 14px 0; padding: 6px 14px; border-left: 2px solid var(--t-result); line-height: 1.7; font-size: 13px; }
  .read-node cite { display: block; font-style: normal; color: var(--ink-dim); font-size: 12px; }
  .read-node figure { margin-top: 16px; }
  .read-node figure img { max-width: 100%; max-height: 600px; background: white; }
  .read-node figcaption { font-size: 12px; color: var(--ink-dim); }
  .read-node .link { display: block; font: inherit; font-size: 13px; text-align: left; color: var(--ink); background: none; border: 0; padding: 8px 0; cursor: pointer; }
  .read-node .link:hover { color: var(--accent); }
  .relation-reason { display: block; margin-top: 4px; color: var(--ink-dim); font-size: 12px; line-height: 1.6; }
  .evidence-status { margin: 12px 0; font-size: 12px; line-height: 1.6; color: var(--ink-dim); }
  .evidence-status.partial, .quote.unmatched { color: var(--t-problem); border-color: var(--t-problem); }
  .evidence-status.matched { color: var(--t-result); }
  #panel, #hdr, #reader, #search { overflow-wrap: anywhere; }
  #panel h2 { padding-right: 22px; }
  #spine-nav { position: fixed; z-index: 2; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
  #spine-nav button { width: 34px; height: 34px; font-size: 22px; color: var(--ink); background: transparent; border: 0; cursor: pointer; }
  #spine-nav button:disabled { opacity: 0.3; cursor: default; }
  #spine-position { min-width: 72px; text-align: center; font-size: 12px; }
  body.reading #gl, body.reading #lbl, body.reading #hdr, body.reading #legend,
  body.reading #panel, body.reading #hud, #hint { display: none; }
  body.reading #toolbar { left: 22px; right: 22px; justify-content: flex-start; }
  body.reading #bt-rotate, body.reading #bt-labels, body.reading #bt-reset { display: none; }
  body.reading #spine-nav { left: auto; right: 22px; transform: none; }
  @media (max-width: 1100px) {
    #toolbar, body.panel-open #toolbar { top: 12px; left: 12px; right: 12px; justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; }
    #toolbar button { flex-shrink: 0; }
    #hdr { top: 62px; left: 12px; width: min(460px, calc(100vw - 24px)); }
    #settings, #search, body.panel-open #search { top: 56px; right: 12px; max-width: calc(100vw - 24px); }
    #legend { bottom: 64px; }
  }
  @media (max-width: 640px) {
    #reader { inset: 56px 0 0; padding: 12px 16px 76px; }
    #reader-title { font-size: 19px; }
    #legend { bottom: 64px; left: 12px; max-width: calc(100vw - 24px); }
    #spine-nav { bottom: 10px; }
    body.panel-open:not(.reading) #spine-nav { bottom: calc(58vh + 8px); }
    body.reading #toolbar { left: 12px; right: 12px; }
  }
  @media print {
    body { overflow: visible; color: #111; background: #fff; }
    #toolbar, #spine-nav, #settings, #search, #lightbox { display: none !important; }
    #reader { position: static; overflow: visible; padding: 0; background: #fff; }
    .read-node { break-inside: avoid; }
    .read-node .link { color: #111; }
  }
</style>

<canvas id="gl"></canvas>
<canvas id="lbl"></canvas>

  // lean in, but never so far that the rest of the argument leaves the frame
  if (changed) goal.dist = Math.max(goal.dist * 0.85, Math.min(goal.dist, 1300));
  // half the panel's real size: a side panel on desktop, a bottom sheet on a phone
  goalOX = W > 640 ? -Math.min(370, W) / 2 : 0;
  goalOY = W > 640 ? 0 : -Math.min(H * 0.58, H) / 2;
  document.body.classList.add("panel-open");
  const col = C.type[n.type] || C.type.unknown;
  const tzh = typeName(n.type);
  const outs = relationHtml(n, true), ins = relationHtml(n, false);
  panelBody.innerHTML = `
    <span class="badge"><i style="background:${css(col, 1)}"></i>${esc(tzh)}</span>
    <h2>${esc(L(n, "label"))}</h2>
    ${L(n, "section") ? `<span class="sec">${esc(L(n, "section"))}</span>` : ""}
    <div class="detail">${esc(L(n, "detail"))}</div>
    ${evidenceHtml(n)}
    ${quoteHtml(n)}
    ${figureHtml(n)}
    ${outs ? `<h3>${esc(T().leadsTo)}</h3>${outs}` : ""}
    ${ins ? `<h3>${esc(T().comesFrom)}</h3>${ins}` : ""}`;
  wireNodeContent(panelBody);
  panel.classList.add("open");
  panel.inert = false; panel.setAttribute("aria-hidden", "false");
  if (changed) panel.scrollTop = 0;
}
function deselect() {
  selected = null;
  panel.classList.remove("open");
  panel.inert = true; panel.setAttribute("aria-hidden", "true");
  document.body.classList.remove("panel-open");
  goalOX = 0; goalOY = 0;
  fitGoal();
  syncSpineNav();
  if (readingMode) renderReader();
}
document.getElementById("panel-close").addEventListener("click", deselect);

function renderReader() {
  document.getElementById("reader-title").textContent = L(DATA, "title");
  document.getElementById("reader-summary").textContent = L(DATA, "summary");
  document.getElementById("reader-provenance").textContent = document.getElementById("hdr-prov").textContent;
  const visible = readingOrder.filter(n => (!spineMode || spineIds.has(n.id)) && !hiddenTypes.has(n.type));
  readerNodes.innerHTML = visible.map(n => {
    const outs = relationHtml(n, true), ins = relationHtml(n, false);
    return `<article class="read-node" id="read-node-${n.idx}" tabindex="-1" data-node-id="${esc(n.id)}" data-selected="${selected === n}">
      <p class="badge">${esc(spineIds.has(n.id) ? T().spineNode : T().supportNode)} · ${esc(typeName(n.type))}</p>
      <h2>${esc(L(n, "label"))}</h2><p class="sec">${esc(L(n, "section"))}</p>
      <div class="detail">${esc(L(n, "detail"))}</div>${evidenceHtml(n)}${quoteHtml(n)}${figureHtml(n)}
      ${outs ? `<h3>${esc(T().leadsTo)}</h3>${outs}` : ""}${ins ? `<h3>${esc(T().comesFrom)}</h3>${ins}` : ""}</article>`;
  }).join("");
  wireNodeContent(readerNodes);
  readerNodes.querySelectorAll(".read-node").forEach(row => row.addEventListener("click", ev => {
    if (ev.target.closest && ev.target.closest("button, figure")) return;
    const n = byId.get(row.dataset.nodeId); if (n) select(n);
  }));
}
function setReading(on) {
  readingMode = on || !gl;
  closeSearch(); toggleSettings(false);
  document.body.classList.toggle("reading", readingMode);
  reader.hidden = !readingMode;
  btGraph.setAttribute("aria-pressed", String(!readingMode)); btGraph.classList.toggle("on", !readingMode);
  btReading.setAttribute("aria-pressed", String(readingMode)); btReading.classList.toggle("on", readingMode);
  panel.classList.remove("open"); panel.inert = true; panel.setAttribute("aria-hidden", "true");
  document.body.classList.remove("panel-open");
  goalOX = 0; goalOY = 0;
  if (readingMode) {
    cancelAnimationFrame(animationFrame); animationFrame = 0;
    renderReader();
    const row = selected && document.getElementById(`read-node-${selected.idx}`);
    if (row) row.scrollIntoView({block:"start", behavior:"auto"});
  } else {
    lastNow = 0; frameAcc = []; resize();
    if (selected) select(selected);
    scheduleRender();
  }
  syncSpineNav();
}
function syncSpineNav() {
  const idx = spineOrder.indexOf(selected);
  document.getElementById("spine-nav").hidden = !spineOrder.length || !selected;
  document.getElementById("spine-prev").disabled = idx <= 0;
  document.getElementById("spine-next").disabled = idx === spineOrder.length - 1;
  document.getElementById("spine-position").textContent = `${idx + 1} / ${spineOrder.length}`;
}
btGraph.addEventListener("click", () => setReading(false));
btReading.addEventListener("click", () => setReading(true));
document.getElementById("spine-prev").addEventListener("click", () => select(spineOrder[spineOrder.indexOf(selected) - 1]));
document.getElementById("spine-next").addEventListener("click", () => select(spineOrder[spineOrder.indexOf(selected) + 1]));
document.getElementById("st-print").addEventListener("click", () => { setReading(true); window.print(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(animationFrame); animationFrame = 0; } else { lastNow = 0; frameAcc = []; scheduleRender(); } });

/* ---------- header, legend, toolbar ---------- */
function renderHeader() {
  document.getElementById("hdr-title").textContent = L(DATA, "title");
  document.getElementById("hdr-summary").textContent = L(DATA, "summary");
  const t = L(DATA, "short_title") || L(DATA, "title");
  if (t) document.title = t;
}
renderHeader();
const meta = DATA.meta || {};
document.getElementById("hdr-meta").textContent = [meta.authors, meta.venue, meta.year].filter(Boolean).join(" · ");

// provenance: which file this graph describes, and whether its numbers were checked against it
function sourceHashText(src) {
  const files = Array.isArray(src && src.files) ? src.files : [];
  const hashes = files.map(f => String(f && f.sha256 || "").slice(0, 12)).filter(Boolean);
  return hashes.length ? hashes.join("+") : String(src && src.sha256 || "").slice(0, 12);
}
function renderProv() {
  const prov = document.getElementById("hdr-prov");
  const src = DATA.source;
  if (!prov) return;
  if (src) {
    const total = src.numbers_checked || 0, ok = src.numbers_verified || 0;
    const head = `${esc(T().provSrc)} ${esc(src.file)} · ${esc(sourceHashText(src))} · `;
    // quotations are the stronger claim of the two, so they are said out loud rather than
    // left in the data for whoever thinks to look
    const qt = src.quotes_checked || 0, qok = src.quotes_verified || 0;
    prov.classList.toggle("unverified", !(total + qt > 0 && ok === total && qok === qt));
    const quotes = qt > 0 ? ` · <b>${esc(T().provQuotes(qok, qt))}</b>` : "";
    prov.innerHTML = total > 0
      ? head + `<b>${esc(T().provFound(ok, total))}</b>${quotes} · ${esc(String(src.built || "").slice(0, 10))}`
      : head + `<b>${esc(T().noNumbers)}</b>${quotes}`;
    if (!qt) prov.innerHTML += ` · ${esc(T().noQuotes)}`;
    prov.title = T().verifyHint;
  } else {
    prov.classList.add("unverified");
    prov.innerHTML = `<b>${esc(T().provNone)}</b> · ${esc(T().provNoneTail)}`;
  }
  prov.hidden = false;
}
renderProv();

const legend = document.getElementById("legend");
const typeCounts = {};
for (const n of nodes) typeCounts[n.type] = (typeCounts[n.type] || 0) + 1;
for (const t of Object.keys(typeCounts)) {
  const chip = document.createElement("button");
  chip.type = "button"; chip.setAttribute("aria-pressed", "true");
  chip.className = "chip";
  const col = cssVar(`--t-${TYPES[t] ? t : "unknown"}`);
  chip.dataset.type = t;
  chip.innerHTML = `<span class="dot" style="background:${col};color:${col}"></span><span class="tn">${esc(typeName(t))}</span> <span class="n">${typeCounts[t]}</span>`;
  chip.addEventListener("click", () => {
    if (hiddenTypes.has(t)) hiddenTypes.delete(t); else hiddenTypes.add(t);
    chip.classList.toggle("off", hiddenTypes.has(t)); chip.setAttribute("aria-pressed", String(!hiddenTypes.has(t))); touchGeom();
  });
  legend.appendChild(chip);
}
const btRotate = document.getElementById("bt-rotate");
btRotate.classList.toggle("on", autoRotate);
btRotate.setAttribute("aria-pressed", String(autoRotate));
btRotate.addEventListener("click", () => { autoRotate = !autoRotate; btRotate.classList.toggle("on", autoRotate); btRotate.setAttribute("aria-pressed", String(autoRotate)); });
const btSpine = document.getElementById("bt-spine");
btSpine.setAttribute("aria-pressed", "false");
if (spineIds.size) {
  btSpine.addEventListener("click", () => { spineMode = !spineMode; btSpine.classList.toggle("on", spineMode); btSpine.setAttribute("aria-pressed", String(spineMode)); touchGeom(); if (readingMode) renderReader(); });
} else {
  // nothing is marked main:true — the filter would just blank the whole graph
  btSpine.disabled = true;
  btSpine.title = T().noSpine;
}
const btLabels = document.getElementById("bt-labels");
btLabels.setAttribute("aria-pressed", "true");
btLabels.addEventListener("click", () => { labelsOn = !labelsOn; btLabels.classList.toggle("on", labelsOn); btLabels.setAttribute("aria-pressed", String(labelsOn)); });
document.getElementById("bt-reset").addEventListener("click", () => {
  hiddenTypes.clear(); touchGeom();
  legend.querySelectorAll(".chip").forEach(c => { c.classList.remove("off"); c.setAttribute("aria-pressed", "true"); });
  spineMode = false; btSpine.classList.remove("on"); btSpine.setAttribute("aria-pressed", "false");
  autoRotate = false; drift = 0; btRotate.classList.remove("on"); btRotate.setAttribute("aria-pressed", "false");
  cam.yaw = -0.55; cam.pitch = 0.3;
  closeSearch(); deselect();
});
/* ---------- the header card: fold, resize, scroll ----------
   It is an overlay on top of the graph, and on a long summary it used to cover most of the
   argument. So: a caret folds it to its title, the corner grip sets its width and the height
   of its text, and the text scrolls inside whatever height is left. All three are remembered. */
const hdr = document.getElementById("hdr");
const hdrBody = document.getElementById("hdr-body");
const hdrFold = document.getElementById("hdr-fold");
const hdrGrip = document.getElementById("hdr-grip");
function setFolded(on) {
  hdr.classList.toggle("folded", on);
  hdrFold.setAttribute("aria-expanded", String(!on));
  hdrFold.title = on ? T().unfold : T().fold;
  store("p3g-hdr-fold", on ? "1" : "0");
}
function setHdrSize(w, h) {
  const maxW = Math.max(240, window.innerWidth - 44);
  const maxH = Math.max(80, window.innerHeight - hdr.getBoundingClientRect().top - 90);
  if (w) hdr.style.width = Math.round(Math.max(260, Math.min(maxW, w))) + "px";
  if (h) hdrBody.style.maxHeight = Math.round(Math.max(56, Math.min(maxH, h))) + "px";
  store("p3g-hdr-size", JSON.stringify([parseInt(hdr.style.width) || 0, parseInt(hdrBody.style.maxHeight) || 0]));
}
hdrFold.addEventListener("click", () => setFolded(!hdr.classList.contains("folded")));
hdr.querySelector("h1").addEventListener("click", () => {
  if (String(getSelection())) return;   // the reader is selecting the title, not folding the card
  setFolded(!hdr.classList.contains("folded"));
});
hdrGrip.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  const x0 = ev.clientX, y0 = ev.clientY;
  const w0 = hdr.getBoundingClientRect().width, h0 = hdrBody.getBoundingClientRect().height;
  // the move/up listeners go on window, not on the grip: pointer capture can be lost mid-drag,
  // and then the moves land on whatever happens to be under the cursor — the card just stops
  // following, and the pointer selects the text it is passing over instead
  const move = e => setHdrSize(w0 + (e.clientX - x0), h0 + (e.clientY - y0));
  const up = () => {
    removeEventListener("pointermove", move);
    removeEventListener("pointerup", up);
    removeEventListener("pointercancel", up);
    document.body.style.userSelect = "";
  };
  document.body.style.userSelect = "none";
  addEventListener("pointermove", move);
  addEventListener("pointerup", up);
  addEventListener("pointercancel", up);
});
try {
  const saved = JSON.parse(store("p3g-hdr-size") || "null");
  if (Array.isArray(saved)) setHdrSize(saved[0], saved[1]);
} catch (e) { /* a corrupt entry just means the default size */ }
setFolded(store("p3g-hdr-fold") === "1");

// The legend wraps to a different number of rows per language and window width, and the hint
// was pinned to the same bottom offset — in Chinese it landed square on the second row and hid
// whole chips. Lift it above whatever the legend currently occupies.
const hintEl = document.getElementById("hint");
function placeHint() {
  const h = legend.getBoundingClientRect().height;
  hintEl.style.bottom = Math.round(22 + (h > 0 ? h + 8 : 0)) + "px";
}
placeHint();
addEventListener("resize", placeHint);
try { new ResizeObserver(placeHint).observe(legend); } catch (e) { /* older browsers: resize only */ }

/* ---------- settings: language and theme ---------- */
/* ---------- PNG export ----------
   Two obstacles, neither of them a flag. The WebGL context is not created with
   preserveDrawingBuffer, so its pixels are only readable inside the same task that drew them —
   hence the fresh synchronous render immediately before the copy. And the labels live on a
   second, 2D canvas stacked over the first, so a copy of either one alone is half a picture.
   Both get composited into an offscreen canvas, and a footer carrying the title and the
   provenance line is drawn underneath: a figure that lands in a talk should say what it is and
   what it was checked against, or it is just a picture of a graph. */
function exportPNG() {
  if (!gl || readingMode) return;
  {
    render(performance.now(), true);
    const w = glc.width, h = glc.height;
    // a window mid-resize can report zero; drawImage throws on a zero-sized source, and a
    // thrown export looks to the reader exactly like a broken page
    if (!(w > 0 && h > 0)) { btPng.classList.add("warn"); setTimeout(() => btPng.classList.remove("warn"), 1500); return; }
    const scale = w / Math.max(1, W);          // device pixels per CSS pixel, whatever DPR is now
    const pad = Math.round(14 * scale);
    const t1 = Math.round(15 * scale), t2 = Math.round(11 * scale);
    const foot = Math.round(t1 * 1.5 + t2 * 2.9 + pad * 2);   // title, file, and the counts
    const out = document.createElement("canvas");
    out.width = w; out.height = h + foot;
    const g = out.getContext("2d");
    if (!g) return;
    g.drawImage(glc, 0, 0);
    g.drawImage(lbl, 0, 0);
    g.fillStyle = css(C.paper, 1);
    g.fillRect(0, h, w, foot);
    g.fillStyle = css(C.inkDim, 0.35);
    g.fillRect(0, h, w, Math.max(1, Math.round(scale)));
    g.textAlign = "left"; g.textBaseline = "top";
    g.fillStyle = css(C.ink, 1);
    g.font = `600 ${t1}px -apple-system, "PingFang SC", sans-serif`;
    g.fillText(elide(g, L(DATA, "title") || "", w - pad * 2), pad, h + pad);
    g.fillStyle = css(C.inkDim, 1);
    g.font = `${t2}px -apple-system, "PingFang SC", sans-serif`;
    // Two lines, because the counts are the substance and must never be the thing that gets
    // shortened. Only the file name is elastic, and it is elided in the middle so both ends of
    // it stay readable.
    const [file, bits] = provenanceParts();
    const room = w - pad * 2;
    let y = h + pad + Math.round(t1 * 1.5);
    g.fillText(elide(g, file, room), pad, y);
    g.fillText(dropToFit(g, bits, room), pad, y + Math.round(t2 * 1.45));
    const name = (L(DATA, "short_title") || L(DATA, "title") || "graph")
      .replace(/[\\/:*?"<>|]/g, "").slice(0, 60).trim() || "graph";
    out.toBlob(b => {
      if (!b) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = `${name}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }, "image/png");
  }
}

// When the counts line will not fit, throw away whole pieces from the back — the date first,
// then the hash — rather than eating through the middle of "93/93 numbers found in the source".
// A half-eaten count is worse than no date: it reads as if the number itself were uncertain.
function dropToFit(g, bits, room) {
  const keep = bits.slice();
  while (keep.length > 1 && g.measureText(keep.join(" · ")).width > room) keep.pop();
  const line = keep.join(" · ");
  return g.measureText(line).width <= room ? line : elide(g, line, room);
}


// Cut a string down to a width from the middle, so both ends of a file name stay readable.
function elide(g, text, room) {
  if (g.measureText(text).width <= room) return text;
  let lo = 0, hi = text.length, best = "…";
  while (lo <= hi) {
    const k = (lo + hi) >> 1;
    const head = Math.ceil(k / 2), tail = k - head;
    const cand = text.slice(0, head) + "…" + (tail ? text.slice(text.length - tail) : "");
    if (g.measureText(cand).width <= room) { best = cand; lo = k + 1; } else { hi = k - 1; }
  }
  return best;
}

// what makes an exported image checkable rather than merely decorative: the file it was built
// from, and how much of it was actually confirmed
const rank = b => (/\d+\s*\/\s*\d+/.test(b) ? 0 : /^[0-9a-f]{12}(?:\+[0-9a-f]{12})*$/.test(b) ? 1 : 2);
function provenanceParts() {
  const s = DATA.source;
  if (!s) return [T().provNone, [T().provNoneTail]];
  const bits = [sourceHashText(s)];
  if (s.numbers_checked) bits.push(T().provFound(s.numbers_verified, s.numbers_checked));
  if (s.quotes_checked) bits.push(T().provQuotes(s.quotes_verified, s.quotes_checked));
  if (s.built) bits.push(String(s.built).slice(0, 10));
  // most important last-to-go first: the counts, then the hash, then the date
  bits.sort((a, b) => rank(a) - rank(b));
  return [`${T().provSrc} ${s.file}`, bits];
}

const btPng = document.getElementById("st-png");
btPng.addEventListener("click", exportPNG);

const THEMES = ["auto", "light", "dark", "blueprint"];
let THEME = THEMES.includes(store("p3g-theme")) ? store("p3g-theme") : "auto";

function applyTheme(t) {
  THEME = t; store("p3g-theme", t);
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  readTheme();
  document.querySelectorAll("#st-theme button").forEach(b => b.classList.toggle("on", b.dataset.v === t));
}
function applyLang(l) {
  LANG = l; store("p3g-lang", l);
  document.documentElement.lang = l === "zh" ? "zh" : "en";
  btRotate.textContent = T().rotate;
  btSpine.textContent = T().spine;
  btLabels.textContent = T().labels;
  document.getElementById("bt-reset").textContent = T().reset;
  btGraph.textContent = T().graphView; btReading.textContent = T().readingView;
  document.getElementById("st-print").textContent = T().print;
  document.getElementById("spine-prev").title = T().previous;
  document.getElementById("spine-prev").setAttribute("aria-label", T().previous);
  document.getElementById("spine-next").title = T().next;
  document.getElementById("spine-next").setAttribute("aria-label", T().next);
  btSearch.title = T().search;
  btSearch.setAttribute("aria-label", T().search);
  searchInput.placeholder = T().searchPlaceholder;
  searchInput.setAttribute("aria-label", T().search);
  searchClose.setAttribute("aria-label", T().searchClose);
  document.getElementById("hint").textContent = T().hint;
  document.getElementById("fallback").textContent = T().noWebGL;
  document.getElementById("st-lang-h").textContent = T().lang;
  document.getElementById("st-theme-h").textContent = T().theme;
  btPng.innerHTML = `${esc(T().png)}<span class="sub">${esc(T().pngSub(glc.width, glc.height))}</span>`;
  if (btSpine.disabled) btSpine.title = T().noSpine;
  legend.querySelectorAll(".chip").forEach(c => {
    const tn = c.querySelector(".tn"); if (tn) tn.textContent = typeName(c.dataset.type);
  });
  document.querySelectorAll("#st-theme button").forEach(b => { b.textContent = T().themeNames[b.dataset.v]; });
  document.querySelectorAll("#st-lang button").forEach(b => b.classList.toggle("on", b.dataset.v === l));
  hdrFold.title = hdr.classList.contains("folded") ? T().unfold : T().fold;
  placeHint();
  renderHeader();
  renderProv();
  if (readingMode) renderReader();
  if (searchPanel.classList.contains("open")) renderSearchResults();
  if (selected) select(selected);            // the open panel is full of translated headings
}

const segLang = document.getElementById("st-lang");
for (const [v, name] of [["en", "English"], ["zh", "中文"]]) {
  const b = document.createElement("button");
  b.dataset.v = v; b.textContent = name;
  b.addEventListener("click", () => applyLang(v));
  segLang.appendChild(b);
}
const segTheme = document.getElementById("st-theme");
for (const v of THEMES) {
  const b = document.createElement("button");
  b.dataset.v = v;
  b.addEventListener("click", () => applyTheme(v));
  segTheme.appendChild(b);
}
const settings = document.getElementById("settings");
const btSettings = document.getElementById("bt-settings");
function toggleSettings(open) {
  if (open) closeSearch();
  settings.classList.toggle("open", open);
  btSettings.classList.toggle("on", open);
  btPng.disabled = !gl || readingMode;
}
btSettings.addEventListener("click", () => toggleSettings(!settings.classList.contains("open")));
// close on an outside click, decided by where the click landed rather than by propagation
addEventListener("pointerdown", ev => {
  if (ev.target.closest && (ev.target.closest("#settings") || ev.target.closest("#bt-settings"))) return;
  toggleSettings(false);
}, true);
addEventListener("keydown", ev => { if (ev.key === "Escape") toggleSettings(false); });

applyTheme(THEME);
applyLang(LANG);
setTimeout(() => document.getElementById("hint").classList.add("fade"), 7000);

btGraph.disabled = !gl;
btGraph.title = gl ? T().graphView : T().noWebGL;
setReading(!gl);
scheduleRender();
</script>
